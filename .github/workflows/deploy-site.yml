name: Deploy moral_compass site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'code/moral_compass/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize scene images (replace symlink with real files)
        run: |
          cd code/moral_compass/data
          if [ -L scenes ]; then
            # Use -L so cp follows the symlink and copies the actual files (webp or png)
            target="$(readlink scenes)"
            rm scenes
            mkdir scenes
            cp -RL ../../wsf_alignment/site/data/scenes_webp/. scenes/ 2>/dev/null || \
              cp -RL "$target"/. scenes/ 2>/dev/null || true
          fi
          echo "scenes/ now contains $(ls scenes/ | wc -l) files"
          echo "scenes/ total size: $(du -sh scenes/ | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site if the API read hasn't propagated yet
          # (fixes the enable-then-deploy race on a fresh repo).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/moral_compass

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
